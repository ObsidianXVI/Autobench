[project]
name = "autobench"
version = "0.1.0"
description = "Stock charting + research backend with an MCP interface for AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "yfinance>=0.2.50",
    "mcp>=2.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "ib_async>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
ui-test = ["playwright>=1.45"]

[project.scripts]
autobench = "autobench.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits real market-data APIs (run with -m live)",
  "ui: drives the compiled web UI in headless Chrome (skipped without Playwright or a UI build)",
]
addopts = "-m 'not live'"
